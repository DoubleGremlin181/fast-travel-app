<?xml version="1.0" encoding="UTF-8"?>
<!-- Fast Travel chevron mark.
     Default colors: Night fg + Denim accent.
     Override via currentColor / CSS:
       - use currentColor by setting stroke="currentColor" on the back polyline
       - or set fill/stroke directly on the polylines. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="Fast Travel">
  <g fill="none" stroke-width="22" stroke-linecap="square" stroke-linejoin="miter">
    <polyline stroke="#0E1020" points="52,60 97,100 52,140"/>
    <polyline stroke="#3E6098" points="103,60 148,100 103,140"/>
  </g>
</svg>
