<?xml version="1.0" encoding="UTF-8"?>
<!-- Fast Travel app icon — mark on Night.
     512×512 source. Squircle corner radius = 22% (iOS-equivalent).
     For display at 128+ px. Small sizes should use per-size renders
     from generate-icons.mjs, which thickens the stroke. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Fast Travel">
  <rect width="512" height="512" rx="114" ry="114" fill="#0E1020"/>
  <!-- Chevron centered, 58% of icon size ≈ 297 px, viewBox 200→297.
       Translate to center: (512-297)/2 = 107.5. Scale 297/200 = 1.485.
       Stroke 22 in 200-unit space → 22*1.485 ≈ 32.7 px actual. -->
  <g transform="translate(107.5,107.5) scale(1.485)">
    <g fill="none" stroke-width="22" stroke-linecap="square" stroke-linejoin="miter">
      <polyline stroke="#F5F2EC" points="52,60 97,100 52,140"/>
      <polyline stroke="#3E6098" points="103,60 148,100 103,140"/>
    </g>
  </g>
</svg>
