<?xml version="1.0" encoding="UTF-8"?>
<!-- Fast Travel — Chrome Web Store marquee promo tile. 1400×560, light mode.
     Optional banner used if the extension is featured in the store marquee. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 560" width="1400" height="560">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F5F2EC"/>
      <stop offset="1" stop-color="#ECE7DC"/>
    </linearGradient>
    <filter id="tileShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="7" stdDeviation="14" flood-color="#0E1020" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="1400" height="560" fill="url(#bg)"/>

  <!-- Oversized chevron watermark, low opacity -->
  <g transform="translate(900,-40) scale(3.6)" opacity="0.07">
    <g fill="none" stroke-width="22" stroke-linecap="square" stroke-linejoin="miter">
      <polyline stroke="#0E1020" points="52,60 97,100 52,140"/>
      <polyline stroke="#3E6098" points="103,60 148,100 103,140"/>
    </g>
  </g>

  <!-- App icon tile (light Paper mark, zoomed) with a soft shadow for definition
       against the light background. -->
  <g transform="translate(130,140)" filter="url(#tileShadow)">
    <rect width="280" height="280" rx="62" ry="62" fill="#F5F2EC"/>
    <g transform="translate(-7.66,-7.66) scale(1.477)">
      <g fill="none" stroke-width="22" stroke-linecap="square" stroke-linejoin="miter">
        <polyline stroke="#0E1020" points="52,60 97,100 52,140"/>
        <polyline stroke="#3E6098" points="103,60 148,100 103,140"/>
      </g>
    </g>
  </g>

  <!-- Wordmark + byline -->
  <text x="480" y="278" font-family="Lato, 'DejaVu Sans', sans-serif" font-weight="900"
        font-size="128" fill="#0E1020" letter-spacing="-3">Fast Travel</text>
  <text x="486" y="350" font-family="Lato, 'DejaVu Sans', sans-serif" font-weight="400"
        font-size="42" fill="#4A4E63">Supercharge your search bar.</text>
</svg>
