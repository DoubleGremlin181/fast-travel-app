<?xml version="1.0" encoding="UTF-8"?>
<!-- Fast Travel — Google Play feature graphic. 1024×500, light mode.
     Re-render with: node docs/store-assets/sources/render.mjs -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 500" width="1024" height="500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F5F2EC"/>
      <stop offset="1" stop-color="#ECE7DC"/>
    </linearGradient>
    <filter id="tileShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#0E1020" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="1024" height="500" fill="url(#bg)"/>

  <!-- Oversized chevron watermark, Denim, low opacity -->
  <g transform="translate(600,-30) scale(3.0)" opacity="0.07">
    <g fill="none" stroke-width="22" stroke-linecap="square" stroke-linejoin="miter">
      <polyline stroke="#0E1020" points="52,60 97,100 52,140"/>
      <polyline stroke="#3E6098" points="103,60 148,100 103,140"/>
    </g>
  </g>

  <!-- App icon tile (light Paper mark, zoomed) with a soft shadow so the light
       tile stays defined against the light background. -->
  <g transform="translate(96,130)" filter="url(#tileShadow)">
    <rect width="240" height="240" rx="53" ry="53" fill="#F5F2EC"/>
    <g transform="translate(-6.56,-6.56) scale(1.266)">
      <g fill="none" stroke-width="22" stroke-linecap="square" stroke-linejoin="miter">
        <polyline stroke="#0E1020" points="52,60 97,100 52,140"/>
        <polyline stroke="#3E6098" points="103,60 148,100 103,140"/>
      </g>
    </g>
  </g>

  <!-- Wordmark + byline -->
  <text x="392" y="250" font-family="Lato, 'DejaVu Sans', sans-serif" font-weight="900"
        font-size="100" fill="#0E1020" letter-spacing="-2">Fast Travel</text>
  <text x="396" y="312" font-family="Lato, 'DejaVu Sans', sans-serif" font-weight="400"
        font-size="34" fill="#4A4E63">Supercharge your search bar.</text>
</svg>
