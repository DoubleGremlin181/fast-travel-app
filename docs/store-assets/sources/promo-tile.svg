<?xml version="1.0" encoding="UTF-8"?>
<!-- Fast Travel — Chrome Web Store small promo tile. 440×280, light mode. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 280" width="440" height="280">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F5F2EC"/>
      <stop offset="1" stop-color="#ECE7DC"/>
    </linearGradient>
  </defs>

  <rect width="440" height="280" fill="url(#bg)"/>

  <!-- Centered icon tile (the real Night mark, zoomed) -->
  <g transform="translate(160,34)">
    <rect width="120" height="120" rx="27" ry="27" fill="#0E1020"/>
    <g transform="translate(-3.28,-3.28) scale(0.633)">
      <g fill="none" stroke-width="22" stroke-linecap="square" stroke-linejoin="miter">
        <polyline stroke="#F5F2EC" points="52,60 97,100 52,140"/>
        <polyline stroke="#3E6098" points="103,60 148,100 103,140"/>
      </g>
    </g>
  </g>

  <text x="220" y="210" text-anchor="middle" font-family="Lato, 'DejaVu Sans', sans-serif"
        font-weight="900" font-size="44" fill="#0E1020" letter-spacing="-1">Fast Travel</text>
  <text x="220" y="242" text-anchor="middle" font-family="Lato, 'DejaVu Sans', sans-serif"
        font-weight="400" font-size="18" fill="#4A4E63">Supercharge your search bar</text>
</svg>
