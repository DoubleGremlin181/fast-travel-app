name: DNS over Wikipedia

# NOTE: this workflow is not yet activated. The `schedule` trigger is
# intentionally commented out until the dns-over-wikipedia tool is wired into
# specific commands and the surface area is reviewed. Re-enable by uncommenting
# the cron entry once a maintainer has confirmed which command(s) it feeds.
on:
  # schedule:
  #   - cron: '0 6 * * *'   # daily at 6 AM UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  check-domains:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        # actions/checkout@v4
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup Node.js
        # actions/setup-node@v4.4.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      - name: Check domain health
        id: check
        run: |
          set +e
          REPORT=$(node tools/dns-over-wikipedia/check-domains.mjs 2>&1)
          echo "$REPORT"
          # Extract the JSON portion (stdout only)
          JSON_REPORT=$(node tools/dns-over-wikipedia/check-domains.mjs 2>/dev/null)
          UNREACHABLE=$(echo "$JSON_REPORT" | node -e "
            const fs = require('fs');
            const input = fs.readFileSync('/dev/stdin', 'utf-8');
            const report = JSON.parse(input);
            console.log(report.unreachable.length);
          ")
          echo "unreachable_count=$UNREACHABLE" >> "$GITHUB_OUTPUT"

      - name: Update config with alternatives
        if: steps.check.outputs.unreachable_count != '0'
        run: node tools/dns-over-wikipedia/check-domains.mjs --update-config

      - name: Validate updated config
        if: steps.check.outputs.unreachable_count != '0'
        # Fails the job (and skips the PR) if the script produced an invalid config.
        run: node tools/validate-config.mjs

      - name: Create Pull Request
        if: steps.check.outputs.unreachable_count != '0'
        # peter-evans/create-pull-request@v6.1.0
        uses: peter-evans/create-pull-request@c5a7806660adbe173f04e3e038b0ccdcd758773c
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "fix: update unreachable domains with alternatives from Wikipedia"
          title: "fix: update unreachable domains (DNS over Wikipedia)"
          body: |
            ## Automated Domain Health Check

            The daily DNS over Wikipedia check found unreachable domains in the
            default config. This PR replaces them with alternatives discovered
            via Wikipedia.

            Please review the suggested replacements before merging.
          branch: dns-over-wikipedia/domain-updates
          delete-branch: true
