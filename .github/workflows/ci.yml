name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  extension:
    name: Extension — build and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate config
        run: node tools/validate-config.mjs

      - name: Check version consistency
        run: node tools/test-version-consistency.mjs

      - name: Build extension (Chrome)
        run: npm run build -w extension

      - name: Build extension (Firefox)
        run: npm run build:firefox -w extension

      - name: Unit tests
        run: npm test -w extension

  extension-e2e:
    name: Extension — e2e tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build extension (Chrome and Firefox)
        # build:all produces dist-chrome/ and dist-firefox/ for install.spec.ts,
        # leaving dist/ as the Chrome build for the other e2e tests' fixtures.
        run: npm run build:all -w extension

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: extension

      - name: Install Firefox
        # ubuntu-latest (24.04) no longer ships Firefox; install.spec.ts loads
        # the packaged extension into system Firefox via /usr/bin/firefox.
        run: |
          curl -fsSL "https://download.mozilla.org/?product=firefox-latest&os=linux64&lang=en-US" -o /tmp/firefox.archive
          sudo mkdir -p /opt/firefox-install
          sudo tar -xf /tmp/firefox.archive -C /opt/firefox-install
          sudo ln -sf /opt/firefox-install/firefox/firefox /usr/bin/firefox
          /usr/bin/firefox --version

      - name: Run e2e tests
        run: xvfb-run --auto-servernum npm run test:e2e -w extension

  android-unit:
    name: Android — unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4

      - name: Run unit tests
        run: ./gradlew test
        working-directory: android

  android-instrumented:
    name: Android — instrumented tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4

      - name: Enable KVM group permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@e89f39f1abbbd05b1113a29cf4db69e7540cae5a # v2
        with:
          api-level: 33
          arch: x86_64
          script: cd android && ./gradlew connectedAndroidTest
