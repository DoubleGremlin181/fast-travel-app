name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  extension:
    name: Extension — build and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate config
        run: node tools/validate-config.mjs

      - name: Check version consistency
        run: node tools/test-version-consistency.mjs

      - name: Build extension (Chrome)
        run: npm run build -w extension

      - name: Build extension (Firefox)
        run: npm run build:firefox -w extension

      - name: Unit tests
        run: npm test -w extension

  extension-e2e:
    name: Extension — e2e tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build extension
        run: npm run build -w extension

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: extension

      - name: Run e2e tests
        run: npm run test:e2e -w extension

  android-unit:
    name: Android — unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: ./gradlew test
        working-directory: android

  android-instrumented:
    name: Android — instrumented tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          script: cd android && ./gradlew connectedAndroidTest
